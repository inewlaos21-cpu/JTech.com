<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Question Share App</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6fb}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:20px}
input,button{padding:10px;margin:5px 0;width:100%;border-radius:8px;border:1px solid #ccc}
button{background:#4f46e5;color:#fff;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#4338ca}
.hidden{display:none}
.question{border:1px solid #eee;padding:15px;border-radius:12px;margin-top:15px}
img.preview{max-width:150px;display:block;margin-top:8px;border-radius:10px}
.choiceBox{border:1px dashed #ddd;padding:10px;margin-top:10px;border-radius:10px}
</style>
</head>
<body>
<div class="container">

<div class="card" id="createBox">
<h2>สร้างแบบสอบถาม</h2>
<input id="title" placeholder="ชื่อแบบสอบถาม">
<div id="questions"></div>
<button onclick="addQuestion()">+ เพิ่มคำถาม</button>
<button onclick="generateLink()">สร้างลิงก์แชร์</button>
</div>

<div class="card hidden" id="linkBox">
<h3>ลิงก์ของคุณ</h3>
<input id="link" readonly>
</div>

<div class="card hidden" id="answerBox">
<h2 id="formTitle"></h2>
<input id="username" placeholder="ใส่ชื่อของคุณ">
<div id="formQuestions"></div>
<button onclick="submitAnswers()">ส่งคำตอบ</button>
</div>

<div class="card hidden" id="resultBox">
<h2>ส่งคำตอบแล้ว ✅</h2>
</div>

</div>

<script>
let qCount=0;

function addQuestion(){
 qCount++;
 const div=document.createElement("div");
 div.className="question";

 let choicesHTML="";
 for(let i=1;i<=4;i++){
   choicesHTML+=`
   <div class="choiceBox">
     <input placeholder="ข้อความตัวเลือก ${i}" class="choiceText">
     <input type="file" accept="image/*" class="choiceImg">
   </div>`;
 }

 div.innerHTML=`
 <input placeholder="คำถามข้อ ${qCount}" class="qtext">
 <input type="file" accept="image/*" class="qimg">
 ${choicesHTML}
 `;

 document.getElementById("questions").appendChild(div);
}

function encodeData(obj){
 return btoa(encodeURIComponent(JSON.stringify(obj)));
}
function decodeData(str){
 return JSON.parse(decodeURIComponent(atob(str)));
}

function toBase64(file){
 return new Promise(res=>{
  if(!file) return res(null);
  const r=new FileReader();
  r.onload=()=>res(r.result);
  r.readAsDataURL(file);
 });
}

async function generateLink(){
 const title=document.getElementById("title").value;
 const blocks=[...document.querySelectorAll(".question")];
 if(!title||blocks.length===0) return alert("กรอกข้อมูลก่อน");

 let qs=[];

 for(const b of blocks){
   const text=b.querySelector(".qtext").value;
   const qimgFile=b.querySelector(".qimg").files[0];
   if(!text) return alert("คำถามห้ามว่าง");

   const qimg=await toBase64(qimgFile);

   const choices=[];
   const choiceBoxes=b.querySelectorAll(".choiceBox");

   for(const c of choiceBoxes){
     const t=c.querySelector(".choiceText").value;
     const f=c.querySelector(".choiceImg").files[0];
     const img=await toBase64(f);
     if(t||img) choices.push({t,img});
   }

   if(choices.length<2) return alert("ต้องมีอย่างน้อย 2 ตัวเลือก");

   qs.push({text,qimg,choices});
 }

 const data=encodeData({title,qs});
 const url=location.origin+location.pathname+"?data="+data;
 document.getElementById("linkBox").classList.remove("hidden");
 document.getElementById("link").value=url;
}

function loadForm(){
 const params=new URLSearchParams(location.search);
 if(!params.get("data")) return;

 try{
   document.getElementById("createBox").classList.add("hidden");
   const obj=decodeData(params.get("data"));

   document.getElementById("answerBox").classList.remove("hidden");
   document.getElementById("formTitle").innerText=obj.title;

   const box=document.getElementById("formQuestions");

   obj.qs.forEach((q,i)=>{
     const div=document.createElement("div");
     div.className="question";

     let html=`<p><b>${i+1}. ${q.text}</b></p>`;
     if(q.qimg) html+=`<img src="${q.qimg}" class="preview">`;

     html+=q.choices.map(c=>`
      <label style="display:block;margin:10px 0;cursor:pointer">
      <input type="radio" name="q${i}">
      ${c.t?`<span>${c.t}</span>`:""}
      ${c.img?`<img src="${c.img}" class="preview">`:""}
      </label>
     `).join("");

     div.innerHTML=html;
     box.appendChild(div);
   });
 }
 catch{
   alert("ลิงก์เสียหรือข้อมูลผิดพลาด");
 }
}

function submitAnswers(){
 const name=document.getElementById("username").value;
 if(!name) return alert("ใส่ชื่อก่อน");
 document.getElementById("answerBox").classList.add("hidden");
 document.getElementById("resultBox").classList.remove("hidden");
}

loadForm();
</script>
</body>
</html>
